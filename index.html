<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Music</title>
<link rel="manifest" href="/manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; justify-content: center; padding: 1.5rem 1rem 4rem;
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 760px; }
  h1 { font-size: 1.4rem; font-weight: 400; letter-spacing: 0.02em; color: #fff; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 0.5rem; flex-wrap: wrap; }
  .topbar .user-info { font-size: 0.8rem; color: #888; display: flex; align-items: center; gap: 0.5rem; }
  .topbar .user-info strong { color: #1db954; font-weight: 500; }

  .net-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 3px;
    background: #1f1f1f; color: #888;
  }
  .net-badge.online { background: #0d3a1c; color: #1db954; }
  .net-badge.offline { background: #3a1c0d; color: #e0a055; }

  .search-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input[type="text"], input[type="password"] {
    flex: 1; padding: 0.75rem 1rem; border: 1px solid #2a2a2a;
    border-radius: 6px; background: #141414; color: #e0e0e0;
    font-size: 0.95rem; outline: none; transition: border 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: #444; }
  button {
    padding: 0.75rem 1.5rem; border: none; border-radius: 6px;
    background: #1db954; color: #000; font-weight: 600;
    font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #1ed760; }
  button:disabled { background: #2a2a2a; color: #666; cursor: default; }
  button.small { padding: 0.4rem 0.8rem; font-size: 0.78rem; border-radius: 4px; }
  button.secondary { background: #1f1f1f; color: #ccc; font-weight: 500; }
  button.secondary:hover { background: #2a2a2a; }
  button.cached { background: #0d3a1c; color: #1db954; }
  button.cached:hover { background: #145228; }
  button.tiny { padding: 0.3rem 0.55rem; font-size: 0.72rem; border-radius: 3px; }

  #status { font-size: 0.85rem; color: #888; margin-bottom: 1rem; min-height: 1.2em; }

  .result-card {
    display: flex; align-items: center; gap: 0.85rem;
    padding: 0.65rem; background: #141414; border-radius: 8px;
    margin-bottom: 0.4rem; border: 1px solid #1f1f1f;
  }
  .result-card img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #222; flex-shrink: 0; }
  .result-info { flex: 1; min-width: 0; }
  .result-info .title { font-size: 0.88rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-info .meta { font-size: 0.74rem; color: #777; margin-top: 2px; }
  .result-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }

  #player-wrap { margin-top: 1.5rem; padding: 1rem; background: #141414; border-radius: 8px; border: 1px solid #1f1f1f; }
  #player-wrap.hidden { display: none; }
  .now-title { font-size: 0.85rem; color: #aaa; margin-bottom: 0.5rem; }
  audio { width: 100%; height: 40px; margin-bottom: 0.75rem; }
  .player-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .player-controls button { padding: 0.4rem 0.9rem; font-size: 0.8rem; border-radius: 4px; background: #1f1f1f; color: #ccc; font-weight: 500; }
  .player-controls button:hover { background: #2a2a2a; }

  #playlist-wrap { margin-top: 2rem; }
  .playlist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; gap: 0.5rem; flex-wrap: wrap; }
  .playlist-header h2 { font-size: 1rem; font-weight: 500; color: #ccc; }
  .playlist-header .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }

  .playlist-selector {
    display: flex; gap: 0.5rem; margin-bottom: 0.75rem;
    align-items: center; flex-wrap: wrap;
  }
  .playlist-selector select {
    flex: 1; min-width: 180px;
    padding: 0.55rem 0.8rem; border: 1px solid #2a2a2a;
    border-radius: 6px; background: #141414; color: #e0e0e0;
    font-size: 0.88rem; outline: none;
  }
  .playlist-selector select:focus { border-color: #444; }
  .playlist-selector .count {
    font-size: 0.75rem; color: #666; padding: 0.3rem 0.55rem;
    background: #111; border-radius: 3px;
  }

  .playlist-item {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 0.65rem; background: #111; border-radius: 6px;
    margin-bottom: 0.3rem; border: 1px solid #1a1a1a;
  }
  .playlist-item .idx { font-size: 0.75rem; color: #555; width: 1.2rem; text-align: center; flex-shrink: 0; }
  .playlist-item .p-title { flex: 1; font-size: 0.85rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist-item .p-title.cached::after { content: " ⬇"; color: #1db954; font-size: 0.75rem; }
  .playlist-item .p-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
  .playlist-item .p-actions button { padding: 0.25rem 0.5rem; font-size: 0.72rem; border-radius: 3px; background: transparent; color: #666; font-weight: 400; }
  .playlist-item .p-actions button:hover { background: #222; color: #ccc; }
  .empty-list { font-size: 0.82rem; color: #555; padding: 0.75rem 0; text-align: center; }

  #offline-panel {
    margin-top: 1.5rem; padding: 0.85rem; background: #111; border-radius: 8px;
    border: 1px solid #1f1f1f; font-size: 0.8rem; color: #888;
  }
  #offline-panel .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; }
  #offline-panel .row:last-child { margin-bottom: 0; }
  #offline-panel .value { color: #ccc; }

  #auth-overlay {
    position: fixed; inset: 0; background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 100;
  }
  #auth-overlay.hidden { display: none; }
  .auth-box { width: 100%; max-width: 380px; background: #141414; border: 1px solid #1f1f1f; border-radius: 10px; padding: 1.5rem; }
  .auth-box h2 { font-size: 1.2rem; font-weight: 400; color: #fff; margin-bottom: 1.25rem; }
  .auth-box .field { margin-bottom: 0.75rem; }
  .auth-box .field label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.35rem; }
  .auth-box .field input { width: 100%; }
  .auth-box .actions { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .auth-box .actions button { width: 100%; }
  .auth-box .switch { margin-top: 0.75rem; font-size: 0.8rem; color: #777; text-align: center; }
  .auth-box .switch a { color: #1db954; cursor: pointer; text-decoration: none; }
  .auth-box .error { color: #e05555; font-size: 0.8rem; margin-top: 0.5rem; min-height: 1.2em; }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <h2 id="auth-title">Entrar</h2>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="auth-username" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="auth-password" autocomplete="current-password">
    </div>
    <div class="error" id="auth-error"></div>
    <div class="actions">
      <button id="auth-submit">Entrar</button>
    </div>
    <div class="switch" id="auth-switch">
      Não tem conta? <a id="auth-toggle">Criar</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="topbar">
    <h1>Music</h1>
    <div class="user-info" id="user-info" style="display:none">
      <span class="net-badge" id="net-badge">...</span>
      <strong id="username-display"></strong>
      <button class="small secondary" id="btnLogout">Sair</button>
    </div>
  </div>

  <div class="search-row">
    <input type="text" id="query" placeholder="Nome da música, artista ou URL do YouTube..." autocomplete="off">
    <button id="searchBtn">Buscar</button>
  </div>
  <div id="status"></div>
  <div id="results"></div>

  <div id="player-wrap" class="hidden">
    <div class="now-title" id="now-title"></div>
    <audio id="audioEl" controls preload="metadata"></audio>
    <div class="player-controls">
      <button id="btnPrev">Anterior</button>
      <button id="btnNext">Próxima</button>
      <button id="btnStop">Parar</button>
      <button id="btnCacheCurrent">Baixar p/ offline</button>
    </div>
  </div>

  <div id="playlist-wrap">
    <div class="playlist-header">
      <h2>Playlists</h2>
      <div class="actions">
        <button class="small secondary" id="btnNewPlaylist">+ Nova</button>
        <button class="small secondary" id="btnRenamePlaylist">Renomear</button>
        <button class="small secondary" id="btnDeletePlaylist">Excluir</button>
      </div>
    </div>

    <div class="playlist-selector">
      <select id="playlistSelect"></select>
      <span class="count" id="playlistCount">0</span>
    </div>

    <div id="playlist"></div>

    <div style="margin-top:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button class="small secondary" id="btnAddCurrent">Adicionar atual</button>
      <button class="small secondary" id="btnDownloadAll">Baixar tudo</button>
    </div>
  </div>

  <div id="offline-panel">
    <div class="row">
      <span>Modo offline</span>
      <span class="value" id="off-count">0 músicas</span>
    </div>
    <div class="row">
      <span>Espaço usado</span>
      <span class="value" id="off-size">—</span>
    </div>
    <div class="row" style="margin-top:0.5rem">
      <button class="small secondary" id="btnClearOffline">Limpar cache offline</button>
    </div>
  </div>
</div>

<script>
const SERVER_BASE = '';
const $ = id => document.getElementById(id);
const DEFAULT_PLAYLIST = 'Favoritas';

const queryInput = $('query');
const searchBtn = $('searchBtn');
const statusEl = $('status');
const resultsEl = $('results');
const playerWrap = $('player-wrap');
const nowTitle = $('now-title');
const audioEl = $('audioEl');
const playlistEl = $('playlist');
const playlistSelect = $('playlistSelect');
const playlistCount = $('playlistCount');
const authOverlay = $('auth-overlay');
const authTitle = $('auth-title');
const authUsername = $('auth-username');
const authPassword = $('auth-password');
const authError = $('auth-error');
const authSubmit = $('auth-submit');
const authSwitch = $('auth-switch');
const userInfo = $('user-info');
const usernameDisplay = $('username-display');
const netBadge = $('net-badge');

let currentVideo = null;
let playlistIndex = -1;
let currentUser = null;
let authMode = 'login';
let cachedIds = new Set();
let playlistData = { playlists: { [DEFAULT_PLAYLIST]: [] }, active: DEFAULT_PLAYLIST };

function setStatus(msg) { statusEl.textContent = msg; }

function currentTracks() {
  return playlistData.playlists[playlistData.active] || [];
}

function setCurrentTracks(tracks) {
  playlistData.playlists[playlistData.active] = tracks;
}

// ============================================================
//  Service Worker
// ============================================================
async function initSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;

    navigator.serviceWorker.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'list-cached-done') {
        cachedIds = new Set(d.ids);
        renderPlaylist();
        updateOfflinePanel();
      }
      if (d.type === 'prefetch-done') {
        if (d.ok) {
          cachedIds.add(d.videoId);
          setStatus('Baixado para offline.');
          renderPlaylist();
          updateOfflinePanel();
        } else {
          setStatus('Falha ao baixar para offline.');
        }
      }
      if (d.type === 'uncache-done') {
        cachedIds.delete(d.videoId);
        renderPlaylist();
        updateOfflinePanel();
      }
      if (d.type === 'clear-cache-done') {
        cachedIds.clear();
        renderPlaylist();
        updateOfflinePanel();
        setStatus('Cache offline limpo.');
      }
      if (d.type === 'offline-miss') {
        setStatus('Offline e essa música não está baixada.');
      }
    });
    swSend({ type: 'list-cached' });
  } catch (e) {}
}

function swSend(msg) {
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage(msg);
  } else {
    navigator.serviceWorker.ready.then(reg => {
      if (reg.active) reg.active.postMessage(msg);
    });
  }
}

// ============================================================
//  Online/offline
// ============================================================
function updateNetBadge() {
  if (navigator.onLine) {
    netBadge.textContent = '● online';
    netBadge.classList.add('online');
    netBadge.classList.remove('offline');
  } else {
    netBadge.textContent = '● offline';
    netBadge.classList.add('offline');
    netBadge.classList.remove('online');
  }
}
window.addEventListener('online', updateNetBadge);
window.addEventListener('offline', updateNetBadge);

async function updateOfflinePanel() {
  $('off-count').textContent = cachedIds.size + ' música' + (cachedIds.size === 1 ? '' : 's');
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const used = (est.usage || 0) / (1024 * 1024);
      const quota = (est.quota || 0) / (1024 * 1024);
      $('off-size').textContent = used.toFixed(1) + ' MB de ' + quota.toFixed(0) + ' MB';
    }
  } catch (e) { $('off-size').textContent = '—'; }
}

// ============================================================
//  Auth
// ============================================================
function showAuth() {
  authOverlay.classList.remove('hidden');
  userInfo.style.display = 'none';
  authUsername.value = '';
  authPassword.value = '';
  authError.textContent = '';
}
function hideAuth() {
  authOverlay.classList.add('hidden');
  userInfo.style.display = '';
  usernameDisplay.textContent = currentUser;
}
function setAuthMode(mode) {
  authMode = mode;
  if (mode === 'login') {
    authTitle.textContent = 'Entrar';
    authSubmit.textContent = 'Entrar';
    authSwitch.innerHTML = 'Não tem conta? <a id="auth-toggle">Criar</a>';
  } else {
    authTitle.textContent = 'Criar conta';
    authSubmit.textContent = 'Criar conta';
    authSwitch.innerHTML = 'Já tem conta? <a id="auth-toggle">Entrar</a>';
  }
  $('auth-toggle').addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));
  authError.textContent = '';
}

async function doAuth() {
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) { authError.textContent = 'Preencha tudo.'; return; }
  authSubmit.disabled = true;
  const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
  try {
    const res = await fetch(SERVER_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { authError.textContent = data.error || 'falha'; return; }
    currentUser = data.username;
    hideAuth();
    await loadFromServer();
  } catch (e) {
    authError.textContent = 'erro de rede';
  } finally {
    authSubmit.disabled = false;
  }
}
authSubmit.addEventListener('click', doAuth);
authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
authUsername.addEventListener('keydown', e => { if (e.key === 'Enter') authPassword.focus(); });

$('btnLogout').addEventListener('click', async () => {
  try { await fetch(SERVER_BASE + '/api/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
  currentUser = null;
  playlistData = { playlists: { [DEFAULT_PLAYLIST]: [] }, active: DEFAULT_PLAYLIST };
  renderPlaylistSelector();
  renderPlaylist();
  showAuth();
});

// ============================================================
//  Persistência
// ============================================================
async function loadFromServer() {
  if (!currentUser) return;
  try {
    const res = await fetch(SERVER_BASE + '/api/playlist', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      if (data && data.playlists && typeof data.playlists === 'object') {
        playlistData = {
          playlists: data.playlists,
          active: data.active && data.playlists[data.active] ? data.active : Object.keys(data.playlists)[0]
        };
      }
      renderPlaylistSelector();
      renderPlaylist();
    }
  } catch (e) {
    // offline: fallback localStorage
    try {
      const local = localStorage.getItem('offline_playlists_' + currentUser);
      if (local) {
        playlistData = JSON.parse(local);
        renderPlaylistSelector();
        renderPlaylist();
      }
    } catch (e2) {}
  }
}

async function saveToServer() {
  if (currentUser) {
    try { localStorage.setItem('offline_playlists_' + currentUser, JSON.stringify(playlistData)); } catch (e) {}
  }
  if (!currentUser) return;
  try {
    await fetch(SERVER_BASE + '/api/playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(playlistData)
    });
  } catch (e) {}
}

// ============================================================
//  Busca
// ============================================================
const PIPED_SEARCH = [
  'https://pipedapi.ducks.party',
  'https://pipedapi.adminforge.de',
  'https://pipedapi.reallyaweso.me',
  'https://pipedapi.kavin.rocks'
];

function isYouTubeUrl(str) {
  return /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/.test(str);
}
function extractVideoId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function searchPiped(query) {
  let lastErr = null;
  for (const base of PIPED_SEARCH) {
    try {
      const url = base + '/search?q=' + encodeURIComponent(query) + '&filter=music_songs';
      const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = (data.items || [])
        .filter(it => it.type === 'stream' || it.url)
        .slice(0, 15)
        .map(it => ({
          id: it.url ? it.url.replace('/watch?v=', '') : it.videoId,
          title: it.title || 'Sem título',
          author: it.uploaderName || '',
          thumb: it.thumbnail || ''
        }))
        .filter(it => it.id && it.id.length === 11);
      if (items.length === 0) throw new Error('Sem resultados');
      return items;
    } catch (e) { lastErr = e; continue; }
  }
  throw new Error('Busca falhou: ' + (lastErr ? lastErr.message : '?'));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderResult(r) {
  const card = document.createElement('div');
  card.className = 'result-card';
  const isCached = cachedIds.has(r.id);
  card.innerHTML = `
    <img src="${r.thumb}" alt="" onerror="this.style.display='none'">
    <div class="result-info">
      <div class="title">${escapeHtml(r.title)}</div>
      <div class="meta">${escapeHtml(r.author || '')}</div>
    </div>
    <div class="result-actions">
      <button class="small play">▶</button>
      <button class="small secondary add">+</button>
      <button class="small ${isCached ? 'cached' : 'secondary'} dl">${isCached ? '✓' : '⬇'}</button>
    </div>
  `;
  resultsEl.appendChild(card);
  card.querySelector('.play').addEventListener('click', () => playNow(r));
  card.querySelector('.add').addEventListener('click', () => addToActivePlaylist(r));
  card.querySelector('.dl').addEventListener('click', () => {
    if (cachedIds.has(r.id)) swSend({ type: 'uncache', videoId: r.id });
    else { swSend({ type: 'prefetch', videoId: r.id }); setStatus('Baixando para offline...'); }
  });
}

function getAudioStream(videoId) { return SERVER_BASE + '/audio/' + videoId; }

async function playNow(track) {
  currentVideo = track;
  nowTitle.textContent = track.title;
  playerWrap.classList.remove('hidden');
  if (!cachedIds.has(track.id) && !navigator.onLine) {
    setStatus('Offline e essa música não está baixada.');
  } else if (cachedIds.has(track.id)) {
    setStatus('Tocando do cache offline.');
  } else {
    setStatus('Preparando áudio...');
  }
  try {
    audioEl.src = getAudioStream(track.id);
    audioEl.load();
    await audioEl.play();
  } catch (err) {
    setStatus('Erro ao tocar: ' + err.message);
  }
}

// ============================================================
//  Playlists
// ============================================================
function renderPlaylistSelector() {
  playlistSelect.innerHTML = '';
  const names = Object.keys(playlistData.playlists);
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === playlistData.active) opt.selected = true;
    playlistSelect.appendChild(opt);
  });
  playlistCount.textContent = currentTracks().length + ' música' + (currentTracks().length === 1 ? '' : 's');
}

playlistSelect.addEventListener('change', () => {
  playlistData.active = playlistSelect.value;
  playlistIndex = -1;
  renderPlaylist();
  renderPlaylistSelector();
  saveToServer();
});

$('btnNewPlaylist').addEventListener('click', () => {
  const name = prompt('Nome da nova playlist:');
  if (!name) return;
  const trimmed = name.trim().slice(0, 60);
  if (!trimmed) return;
  if (playlistData.playlists[trimmed]) {
    setStatus('Já existe uma playlist com esse nome.');
    return;
  }
  playlistData.playlists[trimmed] = [];
  playlistData.active = trimmed;
  renderPlaylistSelector();
  renderPlaylist();
  saveToServer();
  setStatus('Playlist "' + trimmed + '" criada.');
});

$('btnRenamePlaylist').addEventListener('click', () => {
  const oldName = playlistData.active;
  const name = prompt('Renomear "' + oldName + '" para:', oldName);
  if (!name) return;
  const trimmed = name.trim().slice(0, 60);
  if (!trimmed || trimmed === oldName) return;
  if (playlistData.playlists[trimmed]) {
    setStatus('Já existe uma playlist com esse nome.');
    return;
  }
  // preserva ordem
  const newPlaylists = {};
  Object.keys(playlistData.playlists).forEach(k => {
    newPlaylists[k === oldName ? trimmed : k] = playlistData.playlists[k];
  });
  playlistData.playlists = newPlaylists;
  playlistData.active = trimmed;
  renderPlaylistSelector();
  saveToServer();
  setStatus('Renomeada para "' + trimmed + '".');
});

$('btnDeletePlaylist').addEventListener('click', () => {
  const name = playlistData.active;
  const names = Object.keys(playlistData.playlists);
  if (names.length === 1) {
    setStatus('Não é possível excluir a única playlist.');
    return;
  }
  if (!confirm('Excluir a playlist "' + name + '" e todas as músicas dela?')) return;
  delete playlistData.playlists[name];
  playlistData.active = Object.keys(playlistData.playlists)[0];
  renderPlaylistSelector();
  renderPlaylist();
  saveToServer();
  setStatus('Playlist excluída.');
});

function addToActivePlaylist(track) {
  const tracks = currentTracks();
  if (tracks.find(t => t.id === track.id)) {
    setStatus('Já está na playlist "' + playlistData.active + '".');
    return;
  }
  tracks.push({ id: track.id, title: track.title, author: track.author, thumb: track.thumb });
  setCurrentTracks(tracks);
  renderPlaylist();
  renderPlaylistSelector();
  saveToServer();
  setStatus('Adicionado a "' + playlistData.active + '".');
}

function removeFromPlaylist(idx) {
  const tracks = currentTracks();
  tracks.splice(idx, 1);
  setCurrentTracks(tracks);
  if (playlistIndex === idx) playlistIndex = -1;
  else if (playlistIndex > idx) playlistIndex--;
  renderPlaylist();
  renderPlaylistSelector();
  saveToServer();
}

function moveInPlaylist(idx, dir) {
  const tracks = currentTracks();
  const n = idx + dir;
  if (n < 0 || n >= tracks.length) return;
  [tracks[idx], tracks[n]] = [tracks[n], tracks[idx]];
  setCurrentTracks(tracks);
  renderPlaylist();
  saveToServer();
}

function playPlaylistItem(idx) {
  const tracks = currentTracks();
  if (idx < 0 || idx >= tracks.length) return;
  playlistIndex = idx;
  playNow(tracks[idx]);
}

function renderPlaylist() {
  playlistEl.innerHTML = '';
  const tracks = currentTracks();
  if (tracks.length === 0) {
    playlistEl.innerHTML = '<div class="empty-list">Playlist vazia. Adicione músicas com o botão + nos resultados.</div>';
    return;
  }
  tracks.forEach((t, i) => {
    const isCached = cachedIds.has(t.id);
    const item = document.createElement('div');
    item.className = 'playlist-item';
    item.innerHTML = `
      <span class="idx">${i + 1}</span>
      <span class="p-title ${isCached ? 'cached' : ''}">${escapeHtml(t.title)}</span>
      <div class="p-actions">
        <button class="play-item">▶</button>
        <button class="up">↑</button>
        <button class="down">↓</button>
        <button class="dl-item">${isCached ? '✓' : '⬇'}</button>
        <button class="del">✕</button>
      </div>
    `;
    playlistEl.appendChild(item);
    item.querySelector('.play-item').addEventListener('click', () => playPlaylistItem(i));
    item.querySelector('.up').addEventListener('click', () => moveInPlaylist(i, -1));
    item.querySelector('.down').addEventListener('click', () => moveInPlaylist(i, 1));
    item.querySelector('.del').addEventListener('click', () => removeFromPlaylist(i));
    item.querySelector('.dl-item').addEventListener('click', () => {
      if (cachedIds.has(t.id)) swSend({ type: 'uncache', videoId: t.id });
      else swSend({ type: 'prefetch', videoId: t.id });
    });
  });
}

// ============================================================
//  Eventos
// ============================================================
searchBtn.addEventListener('click', async () => {
  const q = queryInput.value.trim();
  if (!q) return;
  if (!navigator.onLine) { setStatus('Sem internet. Não é possível buscar.'); return; }
  searchBtn.disabled = true;
  resultsEl.innerHTML = '';
  setStatus('Buscando...');
  try {
    if (isYouTubeUrl(q)) {
      const id = extractVideoId(q);
      const track = { id, title: 'Vídeo ' + id, author: '', thumb: 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg' };
      renderResult(track);
      playNow(track);
    } else {
      const results = await searchPiped(q);
      results.forEach(renderResult);
      setStatus(results.length + ' resultados.');
    }
  } catch (err) {
    setStatus('Erro: ' + err.message);
  } finally {
    searchBtn.disabled = false;
  }
});
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchBtn.click(); });

$('btnPrev').addEventListener('click', () => {
  if (playlistIndex > 0) { playlistIndex--; playPlaylistItem(playlistIndex); }
});
$('btnNext').addEventListener('click', () => {
  const tracks = currentTracks();
  if (playlistIndex >= 0 && playlistIndex < tracks.length - 1) { playlistIndex++; playPlaylistItem(playlistIndex); }
});
$('btnStop').addEventListener('click', () => {
  audioEl.pause(); audioEl.currentTime = 0;
  currentVideo = null; nowTitle.textContent = '';
});
$('btnCacheCurrent').addEventListener('click', () => {
  if (currentVideo) {
    if (cachedIds.has(currentVideo.id)) swSend({ type: 'uncache', videoId: currentVideo.id });
    else swSend({ type: 'prefetch', videoId: currentVideo.id });
  }
});
$('btnAddCurrent').addEventListener('click', () => {
  if (currentVideo) addToActivePlaylist(currentVideo);
  else setStatus('Nada tocando agora.');
});
$('btnDownloadAll').addEventListener('click', () => {
  const tracks = currentTracks();
  if (tracks.length === 0) { setStatus('Playlist vazia.'); return; }
  const toDownload = tracks.filter(t => !cachedIds.has(t.id));
  if (toDownload.length === 0) { setStatus('Tudo já está baixado.'); return; }
  setStatus('Baixando ' + toDownload.length + ' música(s)...');
  toDownload.forEach((t, i) => {
    setTimeout(() => swSend({ type: 'prefetch', videoId: t.id }), i * 500);
  });
});
$('btnClearOffline').addEventListener('click', () => {
  if (confirm('Apagar todos os áudios baixados para offline?')) {
    swSend({ type: 'clear-cache' });
  }
});
audioEl.addEventListener('ended', () => {
  const tracks = currentTracks();
  if (playlistIndex >= 0 && playlistIndex < tracks.length - 1) {
    playlistIndex++; playPlaylistItem(playlistIndex);
  }
});

// ============================================================
//  Boot
// ============================================================
setAuthMode('login');
renderPlaylistSelector();
renderPlaylist();
updateNetBadge();
updateOfflinePanel();
initSW();
setTimeout(() => swSend({ type: 'list-cached' }), 1500);
checkSession();

async function checkSession() {
  try {
    const res = await fetch(SERVER_BASE + '/api/me', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      currentUser = data.username;
      hideAuth();
      await loadFromServer();
      return;
    }
  } catch (e) {}
  showAuth();
}
</script>
